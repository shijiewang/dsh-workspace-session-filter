name: publish

# Tag-driven publishing. The tag must match package.json: the check below fails
# the run otherwise, so a stray tag never publishes the wrong version.
#
# Auth: an npm granular access token with "Bypass 2FA" and read/write is stored as
# the NPM_TOKEN secret. (Trusted publishing over OIDC would also work once a
# trusted publisher connection exists on npmjs.com for this repository.)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "$want" || { echo "tag ${GITHUB_REF_NAME} != ${want}"; exit 1; }

      - name: Install nothing, test what ships
        run: node --check client.js && node --check index.js && node test/smoke.cjs

      - name: Publish
        if: env.NPM_TOKEN != ''
        run: npm publish --registry https://registry.npmjs.org/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: No token, nothing published
        if: env.NPM_TOKEN == ''
        run: |
          echo "::warning::NPM_TOKEN is not set, so this tag built and tested but did not publish."
          echo "Add a granular npm token with Bypass 2FA as the NPM_TOKEN secret, then re-run this job." >> "$GITHUB_STEP_SUMMARY"
