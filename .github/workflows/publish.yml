name: publish

# Publishing uses npm trusted publishing (OIDC): no long-lived token lives in the
# repository or in a secret. GitHub mints a short-lived identity token, npm verifies
# it against the trusted publisher connection configured on the package, and the
# registry accepts the upload.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the newest npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install nothing, test what ships
        run: node --check client.js && node test/smoke.cjs

      - name: Publish
        run: npm publish --registry https://registry.npmjs.org/ --access public --provenance
